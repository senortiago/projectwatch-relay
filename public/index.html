<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Project Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div id="toast-container"></div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen active">
        <div class="card login-card">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <h1 class="logo-text">Project Watch</h1>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="password">Server Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="screen-dashboard" class="screen">
        <header class="app-header">
            <div class="logo-container-small">
                <div class="logo-icon-small"></div>
                <h2>Dashboard</h2>
            </div>
            <button id="btn-logout" class="btn btn-outline btn-sm">Logout</button>
        </header>

        <main class="dashboard-content">
            <!-- Pairing View -->
            <div id="view-pairing" class="card view-panel active">
                <h3>Connect to a Device</h3>
                <p class="subtitle">Enter the 6-digit code shown on the Android device.</p>
                
                <div class="server-info">
                    <span class="label">Server URL:</span>
                    <span id="server-url-display" class="value">wss://...</span>
                </div>

                <div class="pairing-code-container">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                    <input type="text" class="digit-input" maxlength="1" pattern="[0-9]*" inputmode="numeric">
                </div>

                <button id="btn-pair" class="btn btn-primary btn-block" disabled>Connect</button>
                <div id="pair-error" class="error-msg"></div>
            </div>

            <!-- Device View -->
            <div id="view-device" class="card view-panel">
                <div class="device-header">
                    <div class="device-icon">📱</div>
                    <div class="device-info">
                        <h3 id="device-name">Android Device</h3>
                        <p class="status-text"><span class="status-dot offline" id="dash-status-dot"></span> <span id="dash-status-text">Disconnected</span></p>
                    </div>
                </div>
                
                <div class="device-actions">
                    <button id="btn-connect" class="btn btn-primary btn-block btn-lg">Start Session</button>
                    <button id="btn-unpair" class="btn btn-text btn-sm mt-3">Unpair Device</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Controller Screen -->
    <div id="screen-controller" class="screen">
        <header class="controller-header">
            <div class="ctrl-left">
                <button id="btn-back-dash" class="icon-btn tooltip" data-tooltip="Back to Dashboard">🔙</button>
                <div class="ctrl-status">
                    <span class="status-dot online" id="ctrl-status-dot"></span>
                    <span id="ctrl-device-name">Device</span>
                </div>
            </div>
            
            <div class="ctrl-center">
                <div class="pill-badge" id="fps-counter">0 FPS</div>
                <div class="pill-badge" id="quality-badge">HQ</div>
            </div>
            
            <div class="ctrl-right">
                <button id="btn-fullscreen" class="icon-btn tooltip" data-tooltip="Fullscreen">🔲</button>
            </div>
        </header>

        <div class="controller-toolbar">
            <button class="tool-btn" data-action="home" title="Home">🏠</button>
            <button class="tool-btn" data-action="back" title="Back">◀</button>
            <button class="tool-btn" data-action="recents" title="Recents">⬆</button>
            <div class="separator"></div>
            <button class="tool-btn" id="btn-paste" title="Paste to Device">📋➡️</button>
            <button class="tool-btn" id="btn-copy" title="Copy from Device">⬅️📋</button>
            <div class="separator"></div>
            <button class="tool-btn" data-action="volume_up" title="Vol+">🔊</button>
            <button class="tool-btn" data-action="volume_down" title="Vol-">🔉</button>
            <div class="separator"></div>
            <button class="tool-btn" data-action="wake_screen" title="Wake">💡</button>
            <button class="tool-btn" data-action="lock_screen" title="Lock">🔒</button>
        </div>

        <div class="viewer-container" id="viewer-container">
            <div id="viewer-overlay" class="viewer-overlay">
                <div class="spinner"></div>
                <p id="overlay-text">Connecting...</p>
            </div>
            <canvas id="screen-canvas"></canvas>
        </div>

        <footer class="controller-footer">
            <div class="footer-stats">
                <span id="res-indicator">0x0</span>
                <span class="divider">|</span>
                <span id="latency-indicator">Latency: --</span>
            </div>
            <div class="footer-hints">
                Esc = Back, Enter, Type to input text
            </div>
        </footer>
    </div>

    <script src="js/clipboard.js"></script>
    <script src="js/input.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
